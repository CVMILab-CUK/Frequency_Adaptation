trainer:
  ckpt_dir: /home/work/model/Frequency_Adaptation/ckpt_dir
  log_dir: /home/work/model/Frequency_Adaptation/log_dirs
  batch_size: 8
  num_workers: 2
  learning_rate: 0.0001
  lr_warmup_steps: 50
  lr_scheduler: cosine
  total_epoch: 1500
  val_interval: 100000
  log_interval: 100
  seed: 2026
  ema_step: 10
  snr_gamma: 5.0
  max_grad_norm: 1.0
  use_deepspeed: false
  gradient_checkpointing: false
datasets:
  data_path: ./config/data_overfit/
  img_path: /home/work/data/ffhq512/images/
  caption_path: /home/work/data/ffhq512/captions.jsonl
  img_size: 512
  frequency_rate: 0.3
  rate_range:
  - 0.0
  - 1.0
  frequency_mode: high_pass
  frequency_img: gray
optimizer:
  learning_rate: 0.0001
  beta1: 0.9
  beta2: 0.999
model:
  name: OVERFIT16
  model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
  report_to: tensorboard
  mixed_precision: bf16
  cfg_scale: 0.0
  cond_dropout: 0.0
  gradient_accumulation_steps: 1
  revision: null
  variant: null
  non_ema_revision: null
  use_ema: false
  off_load_ema: false
  foreach_ema: true
  sa_adapter:
    scale: 1.0
    use_vae: true
    kernel_size: 3
    down_mode: conv
    stem_channels: 0
    zero_init_gate: false
