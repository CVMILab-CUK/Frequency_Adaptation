# Frequency Adaptation -- SD1.5 + local-window structure adapter, FFHQ-512.
# Single H200 (143 GB), bf16, no DeepSpeed: the trainable set is ~0.1 M
# parameters, so sharding buys nothing and only adds failure modes.

trainer:
  ckpt_dir: /home/work/model/Frequency_Adaptation/ckpt_dir
  log_dir:  /home/work/model/Frequency_Adaptation/log_dirs
  batch_size: 8
  num_workers: 4
  learning_rate: 1e-4
  lr_warmup_steps: 500
  lr_scheduler: cosine
  total_epoch: 1
  val_interval: 20
  log_interval: 5
  seed: 2026
  ema_step: 10
  snr_gamma: 5.0
  max_grad_norm: 1.0
  use_deepspeed: false
  gradient_checkpointing: false   # 143 GB of VRAM; trading it for throughput

datasets:
  data_path: ./config/data_smoke/
  img_path: /home/work/data/ffhq512/images/
  caption_path: /home/work/data/ffhq512/captions.jsonl
  img_size: 512
  frequency_rate: random     # randomised-bandwidth training -- the core idea
  rate_range: [0.0, 1.0]     # full spectrum: identity through pure structure
  frequency_mode: high_pass
  frequency_img: gray

optimizer:
  learning_rate: 1e-4
  beta1: 0.9
  beta2: 0.999

model:
  name: SMOKE
  model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
  report_to: tensorboard
  mixed_precision: bf16
  cfg_scale: 0.1             # text-conditioning dropout rate
  cond_dropout: 0.05         # structure-conditioning dropout, enables cond. guidance
  gradient_accumulation_steps: 1
  revision: null
  variant: null
  non_ema_revision: null
  use_ema: true
  off_load_ema: false
  foreach_ema: true

  sa_adapter:
    scale: 1.0
    use_vae: true
    kernel_size: 3
    down_mode: conv
    stem_channels: 0         # 0 = minimal 1x1 projection (~0.1 M params)
